spring.application.name=estacion-nexo
server.port=8080

# F01 · Sesión autenticada: expira tras 30 minutos sin actividad
server.servlet.session.timeout=30m

# Variables para el funcionamiento de JSP y JSTL
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.datasource.url=${NEXO_DB_URL:jdbc:mysql://localhost:3306/estacion_nexo?connectionTimeZone=America/Lima&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${NEXO_DB_USER:nexo}
spring.datasource.password=${NEXO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.flyway.enabled=true
spring.jackson.time-zone=America/Lima
spring.datasource.hikari.maximum-pool-size=10
