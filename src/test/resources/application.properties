spring.datasource.url=${NEXO_TEST_DB_URL:jdbc:mysql://127.0.0.1:13306/nexo_pruebas?connectionTimeZone=America/Lima&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${NEXO_TEST_DB_USER:nexo}
spring.datasource.password=${NEXO_TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.flyway.enabled=true
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.session.timeout=30m
